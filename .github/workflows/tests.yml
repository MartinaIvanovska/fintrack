# Continuous integration: every test tier on every push, on every branch.
#
# Also runs for pull requests and can be started by hand from the Actions tab
# ("Run workflow"), e.g. to re-run on the `tests` branch. Image building and
# publishing stays in docker.yml (master only).
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit, property, integration)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URI: mongodb://localhost:27017 # the service container, instead of Testcontainers
      HYPOTHESIS_PROFILE: ci # 500 derandomized examples per property
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests with the coverage gate (.coveragerc fail_under)
        run: pytest --cov --cov-report=term --cov-report=xml --cov-report=html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: |
            backend/htmlcov/
            backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run test:coverage
      - name: Production build
        # Create React App turns lint warnings into errors when CI=true; the
        # existing warnings are reported, not fatal.
        env:
          CI: false
        run: npm run build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  api-fuzz:
    name: API fuzzing (Schemathesis)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/api

  e2e:
    name: End-to-end (Playwright on the Docker Compose stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: |
          echo "SECRET_KEY=$(openssl rand -hex 32)" > .env
          docker compose up -d --build
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install test dependencies and Chromium
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium
      - name: Wait for the API and the frontend
        run: |
          for url in http://localhost:8000/health http://localhost:3000; do
            timeout 120 bash -c "until curl -fs $url > /dev/null; do sleep 2; done"
          done
      - name: Run the browser tests
        working-directory: backend
        env:
          E2E_FRONTEND_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8000
        run: pytest tests/e2e
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-traces
          # Playwright traces (open with `playwright show-trace`), screenshots, logs
          path: |
            backend/test-results/
            compose-logs.txt
          if-no-files-found: ignore
      - if: always()
        run: docker compose down -v

  security:
    name: Security scan (report only)
    runs-on: ubuntu-latest
    # --report-only: findings (e.g. known advisories in pinned dependencies)
    # are listed on the job's Summary page and in the security-reports
    # artifact without failing the job. The job only fails if a scanner itself
    # can't run or produce its report.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./scripts/setup-venv.sh --no-browsers
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: ./scripts/security-scan.sh --report-only
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports
          path: security-reports/
          if-no-files-found: ignore
