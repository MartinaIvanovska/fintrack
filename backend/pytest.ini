[pytest]
# `pytest` with no arguments runs the fast tiers; e2e needs the full stack
# running and is invoked explicitly with `pytest tests/e2e`.
testpaths = tests/unit tests/property tests/integration

# Every `async def` test runs under pytest-asyncio without an explicit marker.
# Async fixtures share one session-wide event loop, because the Motor client
# in tests/integration/conftest.py is created once and bound to that loop.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

markers =
    unit: fast tests of pure logic, no database or app
    property: Hypothesis property-based tests (generated inputs)
    integration: real FastAPI app against a real test MongoDB
    api: Schemathesis API fuzzing from the OpenAPI schema (run with `pytest tests/api`)
    e2e: browser tests against the running stack (Playwright)

# pytest-env: defaults only (D:), so values already set in the shell win.
# pytest-playwright: keep a trace and a screenshot of every failing e2e test in test-results/.
addopts = --tracing=retain-on-failure --screenshot=only-on-failure --output=test-results

env =
    D:DB_NAME=finance_tracker_test
    D:SECRET_KEY=test-secret-key-not-for-production
